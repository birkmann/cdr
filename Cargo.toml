[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
rust-version = "1.80"
repository = "https://github.com/birkmann/cdr"
homepage = "https://github.com/birkmann/cdr"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
