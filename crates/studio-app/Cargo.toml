[package]
name = "studio-app"
description = "CDR Studio: native desktop coding app built on the CDR harness"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cdr-studio"

[[bin]]
name = "cdr-studio"
path = "src/main.rs"

[lib]
name = "studio_app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
studio-git = { path = "../studio-git" }
studio-pty = { path = "../studio-pty" }
studio-watch = { path = "../studio-watch" }
studio-keys = { path = "../studio-keys" }
studio-lsp = { path = "../studio-lsp" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
rand = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
cron = "0.17"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
ignore = "0.4"
dirs = "6"
which = "7"

[dev-dependencies]
tempfile = { workspace = true }
